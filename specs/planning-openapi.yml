        Extends the derate definition with a status indicating whether the derate is
        active or has been withdrawn from the plan.
      allOf:
        - $ref: "#/components/schemas/Derate"
        - type: object
          properties:
            state:
              type: string
              enum:
                - ACTIVE
                - WITHDRAWN
              description: |
                Current status of the derate within the active plan:
                - ACTIVE – the derate is active in the plan
                - WITHDRAWN – the derate has been withdrawn.
          required:
            - state
