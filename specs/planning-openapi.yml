              items:
                $ref: "#/components/schemas/DerateTimeSeries"
          required:
            - recoverable
            - reasonDescription
            - timeSeries
    DerateTimeSeries:
      type: object
      description: >
        Represents a set of derate values for a specific parameter of the resource.
        Contains a unique series identifier, a flag indicating whether the series
        represents the declared derate or a potential derate after possible recovery,
        the measurement unit, curve type, and a list of period-based data points.
      properties:
        tsId:
          type: integer
          format: int32
          description: >
            Identifier of the time series, unique within the submission.
          examples:
            - 1
            - 2
        recoverableFlag:
          type: string
          enum: 
            - UOBW
            - UPOD
          description: >
            Flag associated with the recoverability attribute. Distinguishes between the
            declared derate (`UOBW`) and the potential derate after possible recovery
            (`UPOD`). The `UOBW` section is mandatory. The `UPOD` section is optional and
            allowed only if recovery is possible.
        measurementUnit:
          type: string
          description: Unit of measurement for the provided values. Allowed value MAW.
          enum: 
            - MAW
        curveType:
          type: string
          enum: 
            - A03
          description: >
            Curve type defining how the derate values are represented. Allowed value: A03.
        seriesPeriods:
          type: array
          minItems: 1
          description: >
            Array of period-based data series describing the derate values over time.
            Must contain at least one element.
          items:
            $ref: "#/components/schemas/SeriesPeriodPoints"
      required:
        - tsId
        - recoverableFlag
        - measurementUnit
        - curveType
        - seriesPeriods
    DerateView:
      description: >
