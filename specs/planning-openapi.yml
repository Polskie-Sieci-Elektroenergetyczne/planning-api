    ReactiveLimitSubmission:
      type: object
      description: >
        Represents a reactive power regulation limits submission for a specific
        resource. The object combines metadata describing the submission context
        with the time-series dataset containing the actual regulation range
        boundaries. Used by participants to declare the allowed range of
        reactive power regulation within a defined time interval, separately
        for the operation state (active power generation) and the compensation
        state (no active power generation).
      properties: 
        meta:
          $ref: "#/components/schemas/ReactiveLimitSubmissionMeta"
        data:
          $ref: "#/components/schemas/TimeSeriesData"
          description: >
            The time-series dataset representing the submitted reactive power 
            regulation limits. Contains the resource identifier, the applicable 
            time interval, and the complete set of time series describing the 
            regulation range boundaries.
            For series where an actual limitation applies, `seriesPeriods` must 
            be provided with the relevant time intervals and quantity values. 
            For series where no limitation applies (the resource can regulate 
            up to its nominal capability for the given combination), 
            `seriesPeriods` must be omitted — this explicit absence is the 
            canonical way to declare "no limitation beyond nominal capability".
      required:
        - meta
        - data
    ReactiveLimitSubmissionMeta:
      description: >
        Metadata describing a reactive power regulation limits submission.
        Extends the generic submission metadata with a mandatory business type
        identifying the submission as reactive power regulation limits (ORMB).
      allOf:
        - $ref: "#/components/schemas/SubmissionMeta"
        - type: object
          properties:
            type:
              type: string
              enum: [ORMB]
              description: >
                Business classification of the submission. For reactive power
                regulation limits submissions, the value must be `ORMB`,
                indicating a reactive power regulation range dataset.
          required: 
            - type
    OutageSubmission:
      type: object
      description: >
        Represents a complete outage submission for a specific resource. The object
        combines submission metadata with the outage-related data, which may represent
        the creation, modification, or withdrawal of an outage depending on the
        operation type.
      properties: 
        meta:
          $ref: "#/components/schemas/OutageSubmissionMeta" 
        data:
          $ref: "#/components/schemas/OutageSubmissionData" 
      required:
        - meta
        - data
    OutageSubmissionMeta:
      description: >
        Metadata describing an outage submission. Extends the generic submission
        metadata with a mandatory business type identifying the dataset as an outage
        report (POS).
      allOf:
        - $ref: "#/components/schemas/SubmissionMeta"
        - type: object
          properties:
            type:
              type: string
              enum: [POS]
              description: >
                Business classification of the submission. For outage reports, the
                value must be `POS`, indicating an outage dataset.
          required: 
            - type
    OutageSubmissionData:
      type: object
      description: >
        Base type for outage submission data. The final structure depends on the
        value of `operationType`, which determines whether the submission represents
        the creation, modification, or withdrawal of an outage.
      properties: 
        operationType:
          $ref: "#/components/schemas/OperationType"
        changeDescription:
          type: string
          maxLength: 512
          description: >
            Descriptive field explaining the reason for the change submitted
            with this request, such as an update or withdrawal of an existing outage.
            Each submission may provide a different justification.
          examples: 
            - 'Opis przyczyny zgłoszenia'
      discriminator: 
        propertyName: operationType
        mapping:
          CREATE: "#/components/schemas/OutageCreateData"
          MODIFY: "#/components/schemas/OutageModifyData"
          WITHDRAW: "#/components/schemas/OutageWithdrawData"
      required:
        - operationType
    OutageCreateData:
      description: >
        Represents the data submitted when creating an outage. Extends
        the base outage submission data with the full outage definition.
      allOf:
        - $ref: "#/components/schemas/OutageSubmissionData"
        - type: object
          required: 
            - outage
          properties:
            outage:
              $ref: "#/components/schemas/Outage"
    OutageModifyData:
      description: >
        Represents the data submitted when modifying an outage. Extends
        the base outage submission data with the full outage definition.
      allOf:
        - $ref: "#/components/schemas/OutageSubmissionData"
        - type: object
          required:
            - outage
          properties:
            outage:
              $ref: "#/components/schemas/Outage"
    OutageWithdrawData:
      description: >
        Represents the data submitted when withdrawing an existing outage. Extends the
        base outage submission data with the withdrawal-specific structure.
      allOf:
        - $ref: "#/components/schemas/OutageSubmissionData"
        - type: object
          required: 
            - outage
          properties:
            outage:
              $ref: "#/components/schemas/UnavailabilityWithdraw"
    Outage:
      description: >
        Represents the full definition of an outage, extending the generic
        unavailability structure with additional attributes specific to outage
        reporting. Includes recoverability information, a detailed reason description,
        and an optional startup schedule describing the resource’s restart profile.
      allOf:
        - $ref: "#/components/schemas/Unavailability"
        - type: object
          properties:
            recoverable:
              type: boolean
              description: |
                Indicates whether the resource is capable of recovering its availability:
                - true – recovery is possible
                - false – recovery is not possible.
            reasonDescription:
              $ref: '#/components/schemas/ReasonDescription'
            startupSchedule:
              $ref: '#/components/schemas/StartupSchedule'
          required:
            - recoverable
            - reasonDescription
    StartupSchedule:
      type: object
      description: >
        Describes the startup characteristics of a resource following an outage.
      properties:
        synchroTime:
          type: integer
          description: >
            Time from the start of the startup process to synchronization, expressed
            in minutes as a multiple of the balancing settlement period (OREB) interval.
          examples:
            - 15
        pminTime:
          type: integer
          description: > 
            Time from synchronization to reaching Pmin, expressed in minutes as a
            multiple of the balancing settlement period (OREB) interval.
          examples:
            - 30
        measurementUnit:
          type: string
          description: Unit of measurement for the provided power levels.
          enum:
            - MAW
        curveType:
          type: string
          description: Curve type defining how the startup values are represented.
          enum:
            - A01
        resolution:
          $ref: "#/components/schemas/Resolution"
        continuousSeriesPoints:
          type: array
          minItems: 1
          description: >
            Array of numerical values representing consecutive points in time for the
            defined startup period, according to the specified resolution.
          items:
            type: number
          examples: 
            - [12.345, 10.001]
      required:
        - synchroTime
        - pminTime
        - measurementUnit
        - curveType
        - resolution
        - continuousSeriesPoints
    OutageView:
      description: >
        Represents the current state of an outage within the active planning dataset.
        Extends the outage definition with a status indicating whether the outage is
        active or has been withdrawn.
      allOf:
        - $ref: "#/components/schemas/Outage"
        - type: object
          description: Dane postoju w aktualnym planie
          properties:
            state:
              type: string
              enum:
                - ACTIVE
                - WITHDRAWN
              description: |
                Current state of the outage within the plan:
                - ACTIVE – the outage is active in the plan
                - WITHDRAWN – the outage has been withdrawn.
          required:
            - state
