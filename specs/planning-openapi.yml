  /pwdp/api/v1/planning/{entityId}/stream:
    get:
      summary: Subscribe to planning process events
      tags:
        - SSE Notifications
      operationId: subscribeToEntityStream
      description: |
        Opens an SSE stream for the specified entity.
         
        Resuming the connection requires providing the Last-Event-ID header.
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: integer
          description: Identyfikator podmiotu odbierającego powiadomienia o zdarzeniach
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: |
            Identyfikator ostatniego otrzymanego zdarzenia.
            Po podaniu tego parametru przekazywane są informacje o zdarzeniach, które wystąpiły po zdarzeniu o zadanym identyfikatorze.
      responses:
        '200':
          description: Poprawnie nawiązano połączenie.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConnectedEvent'
                  - $ref: '#/components/schemas/HeartbeatEvent'
                  - $ref: '#/components/schemas/UnavailabilityChangedEvent'
                  - $ref: '#/components/schemas/SubmissionProcessedEvent'
