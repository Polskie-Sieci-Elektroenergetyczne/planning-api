components:
  responses:
    Submitted:
      description: The input data was successfully received and processing has started
      content:
         application/json:
           schema:
             $ref: "#/components/schemas/SubmissionStatusResponse"
           examples:
             responseSubmitted:
               $ref: '#/components/examples/responseSubmitted'
    Rejected:
      description: An error was detected in the received input data
      content:
         application/json:
           schema:
             $ref: "#/components/schemas/SubmissionStatusResponse"
           examples:
             responseRejected:
               $ref: '#/components/examples/responseRejected'
    BadRequest:
      description: Bad request – the input parameters are invalid or incomplete.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidParameters:
              $ref: '#/components/examples/invalidParameters'
    NotFound:
      description: Resource not found – no data exists for the specified parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              $ref: '#/components/examples/notFound'
  parameters:
    MainResourceMrid:
      name: mainResourceMrid
      in: path
      required: true
      description: mRID identifier of the resource
      schema:
        type: string
        maxLength: 60
      example: '_d8736017-d25d-4952-a3cf-0fa83560e16f'
    UnavailabilityMrid:
      name: unavailabilityMrid
      in: path
      required: true
      description: Unavailability identifier
      schema:
        type: string
        format: uuid
      example: '12346017-d25d-4952-a3cf-0fa83560e16f'
    Start:
      name: start
      in: query
      required: true
      description: Start date and time of the range in UTC
      schema:
        type: string
        format: date-time
      example: '2024-03-12T02:00:00Z'
    End:
      name: end
      in: query
      required: true
      description: End date and time of the range in UTC
      schema:
        type: string
        format: date-time
      example: '2024-03-13T02:00:00Z'
  schemas:
    ResourceMrid:
      type: string
      description: mRID identifier of the resource
      examples:
        - '_d8736017-d25d-4952-a3cf-0fa83560e16f'
      maxLength: 60
    SubmissionMeta:
      type: object
      description: Submission header for planning data
      properties: 
        senderId:
          type: integer
          format: int32
          description: Identifier of the entity submitting the request
          examples:
            - 10999
        responsiblePartyId:
          type: integer
          format: int32
          description: Identifier of the entity responsible for submitting the request
          examples:
            - 10111
        clientMsgId:
          type: string
          maxLength: 36
          description: Submission ID assigned by the API client
          examples:
            - '4bfa71da-146b-4df9-b972-6a5ce18f2342'
        type:
          type: string
          description: Type of the submission message
        DSOcReceivedAt:
          type: string
          format: date-time
          description: >
            Timestamp of original data received by the DSO (UTC) and transferred to this submission. Field only for the case when DSO is intermediary.
          examples:
            - '2024-03-21T01:23:24.567Z'
      required:
        - senderId
        - responsiblePartyId
        - clientMsgId
        - type
    TimeSeriesContinuous:
      allOf:
        - $ref: "#/components/schemas/TimeSeries"
        - type: object
          description: >
           Every period (SeriesPeriodPoints) specifies a time interval and contains an ordered list of change points, 
           each representing the value that becomes effective from the given position onward until the next change occurs. 
           This structure is used when the dataset can be represented efficiently by specifying only value transitions
           rather than full sequences of consecutive time-step values.
          required: 
            - seriesPeriods
          properties:
            seriesPeriods:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SeriesPeriodContinuous"
              description: >
                Periods of a time series with fixed resolution, containing values for all time points
    TimeSeriesPoints:
      allOf:
        - $ref: "#/components/schemas/TimeSeries"
        - type: object
          description: >
            A time series composed of periods, each with its own defined temporal resolution. 
            Every period (SeriesPeriodContinuous) specifies a time interval and provides an ordered list of 
            values corresponding to all consecutive time steps within that interval, according to 
            the resolution defined for that specific period. This structure is used when complete data must be 
            supplied for every time point within each period.
          required: 
            - seriesPeriods
          properties:
            seriesPeriods:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SeriesPeriodPoints"
              description: >
                Periods of a time series with fixed resolution, containing values only for points where the value changes
    TimeSeries:
      type: object
      description: |
        A time series representing a sequence of values for a specific parameter of a resource.
        Each series is uniquely identified within a submission and contains metadata describing the business context, measurement unit, curve type, and the resource to which the data applies.
        The actual values are provided through time periods, whose structure depends on the curve type (continuous values for each interval or discrete points where values change).
        TimeSeries objects are used consistently across schedules, availabilities, dispatch instructions, exchange schedules, and other planning datasets.
      required:
        - tsId
        - businessType
        - measurementUnit
        - resourceMrid
        - curveType
      properties:
        tsId:
          type: integer
          format: int32
          description: Series identifier, unique within the submission
          examples:
            - 1
            - 2
        businessType:
          type: string
          maxLength: 5
          description: Business type describing the data series
          examples:
            - MCSR
        direction:
          $ref: "#/components/schemas/Direction"
        measurementUnit:
          type: string
          description: |
            Unit of measurement for the values
            - MAW - megawatt
            - MWH - megawatt-hour
            - MAR - megavolt-ampere reactive (reactive power, Mvar)
            - FLAG - numeric value interpreted according to the businessType
          enum:
            - MAW
            - MWH
            - MAR
            - FLAG
        resourceMrid:
          $ref: "#/components/schemas/ResourceMrid"
          description: mRID identifier of the resource to which the data series applies
        curveType:
          $ref: "#/components/schemas/CurveType"
      discriminator:
        propertyName: curveType
        mapping:
          A01: "#/components/schemas/TimeSeriesContinuous"
          A03: "#/components/schemas/TimeSeriesPoints"
    SeriesPeriodContinuous:
      type: object
      description: >
        Represents a continuous segment of a time series within a defined time interval.
        Each segment specifies a fixed temporal resolution and provides a list of
        consecutive data points aligned with that resolution.
      properties:
        timeInterval:
          $ref: "#/components/schemas/TimeInterval"
          description: >
            UTC time interval defining the exact range covered by this period of the
            time series. The interval determines how many data points are expected
            based on the specified resolution.
        resolution:
          $ref: "#/components/schemas/Resolution"
          description: >
            Temporal granularity of the series (e.g., 15-minute hourly, daily, monthly). The
            resolution defines the spacing between consecutive data points.
        continuousSeriesPoints:
          type: array
          description: >
            Ordered list of values for consecutive time steps within the period,
            aligned with the defined resolution. Null values may be used to indicate
            missing or unavailable data.
          minItems: 1
          items:
            type: [number, "null"]
          examples:
            - [12.345, 10.001]
      required:
        - resolution
        - timeInterval
        - continuousSeriesPoints
    SeriesPeriodPoints:
      type: object
      description: >
        Represents a segment of a time series containing only the points where the value changes.
        Each point specifies a positional index, while the actual timestamp is derived from the period’s timeInterval and resolution.
      properties:
        timeInterval:
          $ref: "#/components/schemas/TimeInterval"
          description: UTC time interval defining the range within which value-change points may occur.
        resolution:
          $ref: "#/components/schemas/Resolution"
          description: Declared temporal resolution of the period. Used to interpret point positions and compute their actual timestamps.
        seriesPoints:
          type: array
          minItems: 1
          description: >
            An array of points representing consecutive moments where the value changes. 
            Each point specifies a positional index. 
            Points may appear at irregular intervals as long as they fall within the defined time interval.
          items:
            $ref: "#/components/schemas/SeriesPoint"
      required:
        - resolution
        - timeInterval
        - seriesPoints
    SeriesPoint:
      type: object
      description: >
        Represents the value of a time series at a specific position within the period.
        The timestamp is not stored directly and is derived from the point’s position, 
        the period’s timeInterval and its resolution.
      properties:
        position:
          type: integer
          format: int32
          description: >
            Sequential index of the time step within the period. 
            The actual timestamp is computed based on this index, the period’s time interval, and its resolution.
          examples: 
            - 1
        quantity:
          type: [number, "null"]
          description: The value associated with the given time step.
          examples: 
            - 42.128
      required:
        - position
    TimeSeriesData:
      type: object
      description: >
        Container for planning or operational data expressed as one or more time series.
        It identifies the resource to which the data applies, defines the time interval
        covered by the dataset, and provides the collection of time-series structures
        containing the actual values. Used in both submissions and retrieval endpoints
        to represent schedules, availabilities, exchange programs, and other
        planning-related datasets.
      properties:
        mainResourceMrid:
          $ref:  "#/components/schemas/ResourceMrid"
          description: mRID identifier of the resource to which the data applies.
        dataPeriod:
          $ref: "#/components/schemas/TimeInterval"
          description: Time interval defining the range of the provided data.
        timeSeries:
          type: array
          description: Time series.
          items:
            $ref: "#/components/schemas/TimeSeries"
      required:
        - dataPeriod
        - mainResourceMrid
    Unavailability:
      type: object
      description: >
          Represents a declared unavailability of a resource or one of its components.
          The object identifies the unavailability instance, defines the affected time
          interval, and specifies whether the event applies to the entire resource or
          only a specific component. It also includes sequencing information to ensure
          correct processing of subsequent updates related to the same unavailability.
      properties:
        unavailabilityMrid:
          type: string
          format: uuid
          description: >
            Unique identifier of the unavailability event. Assigned by the submitting
            party when reporting a new unavailability. All subsequent updates or
            withdrawals must reference the same identifier.
          examples: 
            - 'd8736017-d25d-4952-a3cf-0fa83560e16f'
        unavailabilityPeriod:
          $ref: '#/components/schemas/TimeIntervalMarks'
          description: >
            Time interval during which the resource or component is unavailable.
        mainResourceMrid:
          $ref:  "#/components/schemas/ResourceMrid"
          description: >
            Identifier of the resource affected by the unavailability.
        isComponent:
          type: boolean
          description: >
            Indicates whether the unavailability applies only to a specific component
            of the resource rather than the entire resource.
          default: false
          examples: 
            - true
        resourceComponentMrid:
          $ref:  "#/components/schemas/ResourceMrid"
          description: >
            Identifier of the affected resource component. Required when
            `isComponent = true`. Used to precisely indicate which part of the
            resource is unavailable.
          examples:
            - '_e8736017-d25d-4952-a3cf-0fa83560e0000'
        orderNo:
          type: integer
          format: int32
          minimum: 1
          description: >
            Sequential number of the submission related to this unavailability.
            Must be greater than or equal to 1. Each subsequent update or withdrawal
            for the same unavailability must use an incremented value. Ensures
            correct chronological processing of related submissions.
          examples: 
            - 1
            - 2
        businessType:
          type: string
          maxLength: 5
          description: >
            Business classification of the unavailability data (e.g., `POS`).
          examples: 
            - POS
        direction:
          $ref:  "#/components/schemas/Direction"
      required:
        - unavailabilityMrid
        - unavailabilityPeriod
        - mainResourceMrid
        - orderNo
        - businessType
    UnavailabilityWithdraw:
      type: object
      description: >
          Represents a withdrawal request for a previously reported unavailability.
          This object identifies the unavailability to be withdrawn, specifies the
          affected resource, and provides a sequential submission number to ensure
          correct chronological processing of updates related to the same
          unavailability event.
      properties:
        unavailabilityMrid:
          type: string
          format: uuid
          description: >
            Unique identifier of the unavailability event being withdrawn.
            Originally assigned by the submitting party when the unavailability
            was first reported. All withdrawal requests must reference this
            identifier.
          examples: 
            - 'd8736017-d25d-4952-a3cf-0fa83560e16f'
        mainResourceMrid:
          $ref:  "#/components/schemas/ResourceMrid"
          description: >
            Identifier of the resource for which the unavailability is being
            withdrawn.
        orderNo:
          type: integer
          format: int32
          description: >
            Sequential number of the submission related to this unavailability.
            Must be greater than or equal to 1. Each subsequent update or
            withdrawal for the same unavailability must use an incremented value.
            Ensures correct chronological processing of related submissions.
      required:
        - unavailabilityMrid
        - mainResourceMrid
        - orderNo
    ScheduleSubmission:
